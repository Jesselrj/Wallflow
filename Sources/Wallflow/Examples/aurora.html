<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Aurora</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #040716;
  }
  .sky {
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, #01030d 0%, #061031 55%, #0b1c4a 100%);
  }
  .stars {
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 8% 12%, rgba(255,255,255,.9), transparent 100%),
      radial-gradient(1px 1px at 21% 44%, rgba(255,255,255,.7), transparent 100%),
      radial-gradient(1.5px 1.5px at 33% 8%, rgba(255,255,255,.8), transparent 100%),
      radial-gradient(1px 1px at 47% 30%, rgba(255,255,255,.6), transparent 100%),
      radial-gradient(1px 1px at 55% 62%, rgba(255,255,255,.8), transparent 100%),
      radial-gradient(1.5px 1.5px at 68% 18%, rgba(255,255,255,.7), transparent 100%),
      radial-gradient(1px 1px at 77% 51%, rgba(255,255,255,.9), transparent 100%),
      radial-gradient(1px 1px at 86% 26%, rgba(255,255,255,.6), transparent 100%),
      radial-gradient(1.5px 1.5px at 93% 70%, rgba(255,255,255,.8), transparent 100%),
      radial-gradient(1px 1px at 14% 71%, rgba(255,255,255,.7), transparent 100%);
    animation: twinkle 5s ease-in-out infinite alternate;
  }
  .aurora {
    position: fixed;
    left: -25%;
    right: -25%;
    top: -45%;
    height: 130%;
    filter: blur(70px);
    opacity: .85;
  }
  .aurora.one {
    background:
      radial-gradient(45% 38% at 30% 42%, rgba(0, 255, 168, .5), transparent 70%),
      radial-gradient(40% 32% at 62% 34%, rgba(64, 128, 255, .42), transparent 70%);
    animation: driftOne 22s ease-in-out infinite alternate;
  }
  .aurora.two {
    background:
      radial-gradient(36% 30% at 55% 46%, rgba(168, 85, 255, .38), transparent 70%),
      radial-gradient(30% 26% at 78% 40%, rgba(0, 200, 255, .30), transparent 70%);
    animation: driftTwo 28s ease-in-out infinite alternate;
  }
  .mountains {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 28%;
    background: #02030a;
    clip-path: polygon(0 62%, 12% 46%, 24% 58%, 38% 34%, 52% 55%, 66% 40%, 80% 58%, 92% 48%, 100% 60%, 100% 100%, 0 100%);
  }
  @keyframes twinkle {
    from { opacity: .55; }
    to { opacity: 1; }
  }
  @keyframes driftOne {
    from { transform: translateX(-6%) rotate(-2deg) scale(1); }
    to { transform: translateX(7%) rotate(2.5deg) scale(1.12); }
  }
  @keyframes driftTwo {
    from { transform: translateX(6%) rotate(1.5deg) scale(1.08); }
    to { transform: translateX(-7%) rotate(-2deg) scale(1); }
  }
</style>
</head>
<body>
  <div class="sky"></div>
  <div class="stars"></div>
  <div class="aurora one"></div>
  <div class="aurora two"></div>
  <div class="mountains"></div>
</body>
</html>
