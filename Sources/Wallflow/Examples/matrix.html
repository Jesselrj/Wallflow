<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Matrix Rain</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
  const canvas = document.getElementById('canvas');
  const context = canvas.getContext('2d');
  const characters = 'アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789';
  const fontSize = 18;
  let drops = [];

  function resize() {
    const scale = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * scale;
    canvas.height = window.innerHeight * scale;
    context.setTransform(scale, 0, 0, scale, 0, 0);
    context.font = fontSize + 'px monospace';
    const columns = Math.max(1, Math.ceil(window.innerWidth / fontSize));
    drops = Array.from({ length: columns }, () => Math.random() * -60);
  }

  window.addEventListener('resize', resize);
  resize();

  let lastTime = 0;
  function frame(time) {
    requestAnimationFrame(frame);
    if (time - lastTime < 45) return;
    lastTime = time;
    context.fillStyle = 'rgba(0, 0, 0, 0.09)';
    context.fillRect(0, 0, window.innerWidth, window.innerHeight);
    context.fillStyle = '#33ff77';
    for (let i = 0; i < drops.length; i++) {
      const character = characters[Math.floor(Math.random() * characters.length)];
      context.fillText(character, i * fontSize, drops[i] * fontSize);
      if (drops[i] * fontSize > window.innerHeight && Math.random() > 0.972) {
        drops[i] = 0;
      }
      drops[i]++;
    }
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
